services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: aurum
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurum -d aurum']
      interval: 10s
      timeout: 5s
      retries: 5
  postgres_enterprise:
    image: postgres:17-alpine
    env_file:
      - .env.enterprise
    environment:
      POSTGRES_USER: enterprise_admin
      POSTGRES_DB: enterprise_db
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - enterprise_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-enterprise/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enterprise_app -d enterprise_db']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  enterprise_postgres_data:
